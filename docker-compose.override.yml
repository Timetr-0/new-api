# New-API single-node deployment defaults for 32 vCPU / 64 GiB.
# Docker Compose loads this file automatically. Run ./bin/docker-up.sh to
# generate missing secrets in .env, build the current source, and start services.
services:
  new-api:
    pull_policy: never
    environment:
      SQL_DSN: "postgresql://root:${POSTGRES_PASSWORD:?Run ./bin/docker-up.sh to initialize .env}@postgres:5432/new-api"
      REDIS_CONN_STRING: "redis://:${REDIS_PASSWORD:?Run ./bin/docker-up.sh to initialize .env}@redis:6379/0"
      SESSION_SECRET: "${SESSION_SECRET:?Run ./bin/docker-up.sh to initialize .env}"
      CRYPTO_SECRET: "${CRYPTO_SECRET:?Run ./bin/docker-up.sh to initialize .env}"
      # Management API requests per IP; model relay limits are set in the dashboard.
      GLOBAL_API_RATE_LIMIT_ENABLE: "true"
      GLOBAL_API_RATE_LIMIT: "1000"
      GLOBAL_API_RATE_LIMIT_DURATION: "1"
      MEMORY_CACHE_ENABLED: "true"
      REDIS_POOL_SIZE: "512"
      # Main and log storage share one pool; keep below PostgreSQL's connection limit.
      SQL_MAX_IDLE_CONNS: "200"
      SQL_MAX_OPEN_CONNS: "500"
      SQL_MAX_LIFETIME: "600"
      # Idle connection reuse, not an active request concurrency limit.
      RELAY_MAX_IDLE_CONNS: "8192"
      RELAY_MAX_IDLE_CONNS_PER_HOST: "2048"
      RELAY_IDLE_CONN_TIMEOUT: "90"
      # Pending quota/statistics updates stay in memory until the next flush.
      BATCH_UPDATE_ENABLED: "true"
      BATCH_UPDATE_INTERVAL: "5"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    environment:
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Run ./bin/docker-up.sh to initialize .env}"
    command:
      - postgres
      - -c
      - max_connections=600
      - -c
      - shared_buffers=4GB
      - -c
      - max_wal_size=4GB
    shm_size: "1gb"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d new-api"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?Run ./bin/docker-up.sh to initialize .env}"]
    environment:
      REDISCLI_AUTH: "${REDIS_PASSWORD:?Run ./bin/docker-up.sh to initialize .env}"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -qx PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
